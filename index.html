<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Essor</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B3D2E">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#F3F7F4;--card:#fff;--tx:#0F2A21;--mut:#4F6B5F;--ok:#0E9F7A;--line:#D5E3DB;--ac:#FFB547;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1F18;--card:#123027;--tx:#F1F7F3;--mut:#A9C2B5;--ok:#3DDBB0;--line:#24473A}}
:root[data-theme="dark"]{--bg:#0B1F18;--card:#123027;--tx:#F1F7F3;--mut:#A9C2B5;--ok:#3DDBB0;--line:#24473A}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0 auto;max-width:520px;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:14px 20px 8px}
header b{font-size:22px;flex:1;letter-spacing:.3px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:14px;font-weight:700}
main{flex:1;overflow-y:auto;padding:8px 20px 16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 1px 3px #0000001a}
.hero{background:linear-gradient(135deg,#0B3D2E,#17794F);color:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 14px #0B3D2E44}
.hero .mut{color:#CFE8DB}.hero .bar{background:#ffffff33}
h1,h2{margin:0}h1{font-size:28px;line-height:1.15}h2{font-size:18px}
p{margin:0}.mut{color:var(--mut);font-size:14px}
button,input{font-family:inherit;font-size:16px;color:inherit}
.btn{min-height:48px;border:0;border-radius:14px;background:var(--ac);color:#0F2A21;font-weight:700;padding:0 18px;cursor:pointer}
.btn:disabled{opacity:.5}
.opt{min-height:48px;text-align:left;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.opt.on,.chip.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
input[type=text]{min-height:48px;box-sizing:border-box;width:100%;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.bar{height:10px;border-radius:5px;background:var(--line)}.bar i{display:block;height:10px;border-radius:5px;background:var(--ac)}
.task{display:flex;align-items:center;gap:14px;min-height:56px;width:100%;text-align:left;padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.dot{flex:none;width:24px;height:24px;border-radius:50%;box-sizing:border-box;border:2px solid var(--mut)}
.task.done .dot{background:var(--ok);border-color:var(--ok)}.task.done span:last-child{text-decoration:line-through;color:var(--mut)}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap}
.me{align-self:flex-end;background:var(--ac);color:#0F2A21}.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.row{display:flex;gap:8px}.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px}
.week{display:flex;align-items:flex-end;gap:8px;height:90px}.week div{flex:1;text-align:center;font-size:12px;color:var(--mut)}.week i{display:block;margin:0 auto 4px;width:70%;border-radius:6px;background:var(--ok)}
nav{display:flex;border-top:1px solid var(--line);padding:4px;background:var(--bg)}
nav button{flex:1;min-height:48px;background:none;border:0;color:var(--mut);cursor:pointer;font-size:13px;padding:0 2px}nav button.on{color:var(--tx);font-weight:700;box-shadow:inset 0 3px 0 var(--ac)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 3px #0000001a}.pc img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--line)}.pc div{padding:10px;display:flex;flex-direction:column;gap:6px}.ava{width:56px;height:56px;border-radius:50%;background:var(--ac);color:#0F2A21;font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none;padding:0}a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}label:focus-within{outline:2px solid var(--ac)}
</style>
</head>
<body>
<header>
<svg width="38" height="38" viewBox="0 0 200 200" aria-hidden="true"><rect width="200" height="200" rx="44" fill="#0B3D2E"/><circle cx="100" cy="100" r="62" fill="#FFB547"/><path d="M70 120 L95 95 L110 110 L135 80 M118 80 H135 V97" fill="none" stroke="#0B3D2E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>
<b>Essor</b><span class="pill" id="st"></span>
</header>
<main id="v"></main>
<nav id="nv"></nav>
<script>
const K='nzela-v1',GOALS=['Faire ma première vente','Gagner 100 $ en une semaine','Lancer mon commerce','Doubler mes ventes'],FREE={idea:1,pitch:2,chat:5};
const FB=['Écris en une phrase ce que tu veux vendre cette semaine','Propose ton produit à 3 personnes aujourd\u2019hui','Note leurs réponses dans l\u2019onglet Ventes'];
const LES=[
['Poser les bonnes questions',["Demande d'abord : « Qu'est-ce que tu cherches exactement ? »","Demande le budget : « Tu veux dépenser autour de combien ? »","Demande pour quand il en a besoin : cela crée l'urgence.","Écoute plus que tu ne parles, puis propose UN seul produit adapté."]],
['Répondre aux objections',["« C'est trop cher » : explique ce qu'il gagne (qualité, durée) avant de baisser le prix.","« Je vais réfléchir » : demande « Qu'est-ce qui te fait hésiter ? »","Propose une petite quantité ou un essai pour réduire son risque.","Ne te fâche jamais : un refus aujourd'hui peut devenir une vente demain."]],
['Vendre en ligne',["Fais des photos claires, avec le prix écrit en $ ou en FC.","Publie chaque jour sur le Statut WhatsApp, Facebook et les groupes de ta ville.","Réponds vite : un client qui attend va chez un autre vendeur.","Propose Mobile Money ou le paiement à la livraison pour rassurer."]],
['Fixer et négocier le prix',["Prix de vente = prix d'achat + tes frais + ton bénéfice.","Ne descends jamais sous ton prix d'achat.","Si tu baisses le prix, demande quelque chose en retour (acheter 2, payer tout de suite).","Affiche les prix en dollars ET en francs pour éviter les confusions."]],
['Faire revenir le client',["Remercie après la vente et demande si tout va bien.","Demande-lui de te recommander à 2 amis.","Garde la liste de tes clients et écris-leur à chaque nouveau produit.","Tiens tes promesses de livraison : la confiance fait vendre."]]];
let S,smp=null,tab='plan',busy=false,C=[],LB=null,pick='',B=null,BF={b:'',s:'',v:'',t:''},PT='',NG=0;
const $=s=>document.querySelector(s);
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const fd=x=>new Date(x.getTime()-x.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const dkey=()=>fd(new Date());
const fm=(x,c)=>c==='CDF'?Math.round(x).toLocaleString('fr')+' FC':x.toFixed(2)+' $';
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||{};S.goal=S.goal||'';S.tasks=S.tasks||{};S.log=S.log||[];S.use=S.use||{};S.rate=S.rate||2800;S.pro=S.pro||0;S.sel=S.sel||0;S.me=S.me||{n:'',s:'',c:'',t:'',d:''};S.shop=S.shop||[];S.sold=S.sold||[];S.ad=S.ad||{i:'',l:'',t:''};
 if(!S.prods)S.prods=[S.prod?{...S.prod,c:'USD'}:{n:'',a:'',v:'',c:'USD'}]}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const P=()=>S.prods[S.sel]||S.prods[0];
const can=k=>S.pro||((S.use[dkey()]||{})[k]||0)<FREE[k];
const bump=k=>{const u=S.use[dkey()]=S.use[dkey()]||{};u[k]=(u[k]||0)+1;save()};
const doneN=d=>{const t=S.tasks[d];return t?t.items.filter(i=>i.d).length:0};
function streak(){let n=0,d=new Date();if(doneN(fd(d))<2)d.setDate(d.getDate()-1);while(doneN(fd(d))>=2){n++;d.setDate(d.getDate()-1)}return n}
async function gen(){
 const old=Object.values(S.tasks).slice(-3).flatMap(t=>t.items.map(i=>i.t)).join(' | ');
 if(smp){try{const r=await smp.json(`Tu es Essor, stratège de commerce bienveillant pour une personne en RD Congo. Objectif : ${S.goal}. Actions récentes à ne pas répéter : ${old||'aucune'}. Donne 3 actions de vente concrètes, faisables aujourd'hui en moins de 30 minutes, gratuites et sans beaucoup de données internet. Réponds seulement par un tableau JSON de 3 phrases courtes en français.`,{modelTier:'quick',cache:false});
  if(Array.isArray(r)&&r.length>=3)return{ai:1,items:r.slice(0,3).map(t=>({t:String(t),d:0}))}}catch(e){}}
 return{ai:0,items:FB.map(t=>({t,d:0}))}}
async function newPlan(){busy=true;render();S.tasks[dkey()]=await gen();busy=false;save();render()}
async function send(txt){
 txt=(txt||'').trim();if(!txt||busy||!smp)return;
 if(!can('chat')){NG=1;render();return}bump('chat');
 C.push({role:'user',content:txt});C.push({role:'assistant',content:''});busy=true;render();
 const IN=`Tu es Essor, coach IA de commerce, bienveillant et concret, pour une personne en RD Congo. Objectif : ${S.goal}. Les prix peuvent être en dollars ou en francs congolais. Réponds en français simple, en 4 phrases maximum, avec une action claire.`;
 const m=C.slice(0,-1).map((x,i)=>i?x:{role:'user',content:IN+'\n\n'+x.content});
 try{await smp(m,{cache:false,modelTier:'quick',onText:({text})=>{C[C.length-1].content=text;if(LB)LB.textContent=text}})}
 catch(e){C[C.length-1].content='Je ne peux pas répondre pour le moment. Réessaie dans un instant.'}
 busy=false;render()}
async function pitch(){
 if(!can('pitch')){NG=1;render();return}bump('pitch');
 const p=P();busy=true;PT='';render();
 try{const r=await smp(`Tu es Essor, stratège de commerce pour une personne en RD Congo. Produit : ${p.n}. Prix de vente : ${p.v||'?'} ${p.c==='CDF'?'francs congolais':'dollars'}. Écris : 1) un discours de vente de 3 phrases à dire à un client, 2) trois questions à poser au client pour comprendre son besoin, 3) la réponse à « c'est trop cher », 4) la réponse à « je vais réfléchir ». Français simple, court.`,{modelTier:'quick',cache:false});PT=r.text}
 catch(e){PT='Je ne peux pas répondre pour le moment. Réessaie.'}
 busy=false;render()}
async function ideas(){
 if(!smp||busy)return;if(!can('idea')){NG=1;render();return}bump('idea');busy=true;B=null;render();
 try{const r=await smp.json(`Tu es Essor, conseiller en commerce pour une personne en RD Congo. Budget de départ : ${BF.b||'très petit'} dollars. Compétences : ${BF.s||'non précisées'}. Ville : ${BF.v||'non précisée'}. Temps par jour : ${BF.t||'2 heures'}. Propose 3 idées de produits ou de commerces réalistes à lancer maintenant, avec vente en ligne possible (WhatsApp, Facebook, mobile money). Réponds seulement par un tableau JSON de 3 objets avec les clés : nom, pourquoi, capital (texte court en dollars), etapes (tableau de 3 phrases courtes pour créer le commerce), gain (estimation prudente, texte court). Français simple.`,{modelTier:'default',cache:false});
  B=Array.isArray(r)?r.slice(0,3):null}catch(e){B=null}
 busy=false;if(!B)B=[];render()}
function render(){
 const v=$('#v'),nv=$('#nv');v.textContent='';nv.textContent='';LB=null;
 $('#st').textContent=S.goal?streak()+' j de suite':'';
 if(!S.acct||!S.in){auth(v);return}
 if(!S.goal){onboard(v);return}
 [['plan','Plan'],['biz','Idées'],['sales','Ventes'],['shop','Boutique'],['coach','Coach'],['plus','Plus']].forEach(([k,l])=>{const b=E('button',tab===k?'on':'',l);b.onclick=()=>{tab=k;render()};nv.append(b)});
 if(NG){NG=0;const c=E('div','card');c.style.cssText='display:flex;flex-direction:column;gap:10px';c.append(E('p','','Tu as atteint la limite gratuite. Passe Premium pour continuer.'));const b=E('button','btn','Voir Premium');b.onclick=()=>{tab='plus';render()};c.append(b);v.append(c)}
 if(tab==='plan'||tab==='shop'||tab==='sales')adBanner(v);
 ({plan,biz,sales,shop,coach,plus})[tab](v)}
let AM='',AE='',AF={};
function auth(v){
 if(!AM)AM=S.acct?'in':'new';
 const h=E('div','hero');h.append(E('h1','','Bienvenue sur Essor'),E('p','mut','Crée ta boutique et vends partout en RD Congo.'));v.append(h);
 const tb=E('div','row');[['new','Créer un compte'],['in','Se connecter']].forEach(([k,l])=>{const b=E('button','opt'+(AM===k?' on':''),l);b.style.flex='1';b.onclick=()=>{AM=k;AE='';render()};tb.append(b)});v.append(tb);
 const g=E('button','opt','Continuer avec Google (bientôt)');g.disabled=true;g.style.opacity='.6';v.append(g);
 const F=AF;
 (AM==='new'?[['n','Ton nom'],['s','Nom de ta boutique'],['e','Ton adresse Gmail']]:[['e','Ton adresse Gmail']]).forEach(([k,ph])=>{const i=E('input');i.type='text';i.inputMode=k==='e'?'email':'text';i.placeholder=ph;i.value=F[k]||'';i.maxLength=60;i.setAttribute('aria-label',ph);i.oninput=()=>{F[k]=i.value};v.append(i)});
 if(AE)v.append(E('p','',AE));
 const go=E('button','btn',AM==='new'?'Créer mon compte':'Me connecter');
 go.onclick=()=>{const e=(F.e||'').trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){AE='Entre une adresse e-mail valide.';render();return}
  if(AM==='new'){if(!(F.n||'').trim()||!(F.s||'').trim()){AE='Entre ton nom et le nom de ta boutique.';render();return}S.acct={e,n:F.n.trim(),s:F.s.trim()};S.me.n=S.acct.n;S.me.s=S.acct.s}
  else if(!S.acct||S.acct.e!==e){AE='Aucun compte avec cette adresse sur cet appareil.';render();return}
  S.in=1;AE='';save();render()};
 v.append(go,E('p','mut','Version démo : le compte est enregistré sur cet appareil. La connexion Google et la synchronisation arrivent avec la version Android et son serveur.'))}
function onboard(v){
 v.append(E('h1','','Ton stratège de commerce.'),E('p','mut','Choisis ton objectif. Essor te donne 3 actions de vente chaque jour.'));
 GOALS.forEach(g=>{const b=E('button','opt'+(pick===g?' on':''),g);b.onclick=()=>{pick=g;render()};v.append(b)});
 const i=E('input');i.type='text';i.placeholder='Ou écris ton propre objectif';i.maxLength=80;i.oninput=()=>{pick=i.value.trim()};v.append(i);
 const go=E('button','btn','Créer mon plan');go.onclick=()=>{if(!pick)return;S.goal=pick;save();tab='plan';newPlan()};v.append(go)}
function plan(v){
 const t=S.tasks[dkey()],n=t?doneN(dkey()):0;
 const g=E('div','hero'),bar=E('div','bar');bar.append(document.createElement('i'));bar.firstChild.style.width=(n/3*100)+'%';
 g.append(E('p','mut','Objectif'),E('h2','',S.goal),bar,E('p','mut',n+' sur 3 actions faites aujourd\u2019hui'));v.append(g);
 if(busy&&!t){v.append(E('p','mut','Essor prépare ton plan du jour…'));return}
 v.append(E('h2','','Tes 3 actions'));
 if(t){t.items.forEach(it=>{const b=E('button','task'+(it.d?' done':''));b.append(E('span','dot'),E('span','',it.t));b.onclick=()=>{it.d=it.d?0:1;save();render()};v.append(b)});
  if(n===3)v.append(E('p','',"Bravo, journée réussie. Reviens demain pour garder ta série."))}
 const nb=E('button','btn',t?'Changer mon plan':'Créer mon plan du jour');nb.disabled=busy;nb.onclick=newPlan;v.append(nb);
 v.append(E('p','mut',smp?'Plan créé par ton coach IA.':'Mode simple : le coach IA n\u2019est pas disponible ici.'))}
function sales(v){
 const p=P(),a=parseFloat(p.a)||0,s=parseFloat(p.v)||0,g=s-a,cu=p.c,sym=cu==='CDF'?'FC':'$';
 v.append(E('h2','','Test de commerce'),E('p','mut','Ajoute tes produits, en dollars ou en francs. Propose-les et note chaque réponse.'));
 const ch=E('div','chips');S.prods.forEach((q,i)=>{const b=E('button','chip'+(i===S.sel?' on':''),q.n||'Produit '+(i+1));b.onclick=()=>{S.sel=i;save();render()};ch.append(b)});
 const ad=E('button','chip','+ Produit');ad.onclick=()=>{S.prods.push({n:'',a:'',v:'',c:'USD'});S.sel=S.prods.length-1;save();render()};ch.append(ad);v.append(ch);
 const cr=E('div','row');[['USD','Dollars ($)'],['CDF','Francs (FC)']].forEach(([k,l])=>{const b=E('button','opt'+(cu===k?' on':''),l);b.style.flex='1';b.onclick=()=>{p.c=k;save();render()};cr.append(b)});v.append(cr);
 [['n','Produit (ex. savon, crédit, jus)'],['a','Prix d\u2019achat en '+sym],['v','Prix de vente en '+sym]].forEach(([k,ph])=>{const i=E('input');i.type='text';i.inputMode=k==='n'?'text':'decimal';i.placeholder=ph;i.value=p[k];i.maxLength=40;i.setAttribute('aria-label',ph);i.oninput=()=>{p[k]=i.value;save()};i.onchange=()=>render();v.append(i)});
 const oc=cu==='CDF'?'USD':'CDF',cv=x=>cu==='CDF'?x/S.rate:x*S.rate;
 if(s>0)v.append(E('p','mut',g>0?`Bénéfice par vente : ${fm(g,cu)} (≈ ${fm(cv(g),oc)}) · ${Math.round(g/s*100)} % du prix`:"Attention : ton prix de vente doit dépasser ton prix d'achat."));
 const L=S.log.filter(x=>(x.p||0)===S.sel),n=L.length,w=L.filter(x=>x.s).length,pr=n?Math.round(w/n*100):0;
 const lv=n<10?'Encore '+(10-n)+' propositions pour ton niveau':pr>=30?'Vendeur solide':pr>=10?'En progression':'Débutant : change ton discours';
 const c=E('div','card');c.style.cssText='display:flex;flex-direction:column;gap:8px';
 c.append(E('p','mut','Ton niveau'),E('h2','',lv),E('p','',`${n} propositions · ${w} ventes · ${pr} % de réussite`),E('p','mut',`Bénéfice estimé : ${fm(w*Math.max(g,0),cu)}`));v.append(c);
 const r=E('div','row');[['Il a refusé',0],['Il a acheté',1]].forEach(([l,x])=>{const b=E('button',x?'btn':'opt',l);b.style.flex='1';b.onclick=()=>{S.log.push({d:dkey(),p:S.sel,s:x});save();render()};r.append(b)});v.append(r);
 if(n){const u=E('button','chip','Annuler la dernière réponse');u.onclick=()=>{const ix=S.log.map(x=>x.p||0).lastIndexOf(S.sel);if(ix>=0)S.log.splice(ix,1);save();render()};v.append(u)}
 const msg=`Bonjour ! Je vends ${p.n||'mon produit'} à ${s?fm(s,cu):'un bon prix'}. Disponible maintenant, livraison possible. Intéressé(e) ? Réponds-moi ici.`;
 const cp=E('button','opt','Copier mon message WhatsApp');cp.onclick=async()=>{try{await navigator.clipboard.writeText(msg);cp.textContent='Message copié'}catch(e){cp.textContent='Copie impossible'}};v.append(cp);
 const pb=E('button','btn',busy?'Essor écrit…':'Créer mon discours de vente');pb.disabled=busy||!p.n||!smp;pb.onclick=pitch;v.append(pb);
 if(!smp)v.append(E('p','mut','Le discours IA demande d\u2019ouvrir la page depuis claude.ai.'));
 if(PT){const k=E('div','card');k.style.whiteSpace='pre-wrap';k.textContent=PT;v.append(k)}
 v.append(E('p','mut','Le niveau est une estimation basée sur tes propres essais.'))}
function biz(v){
 v.append(E('h2','','Quel commerce lancer ?'),E('p','mut','Remplis 4 champs. Essor propose 3 idées et comment les créer.'));
 if(!smp){v.append(E('p','mut','Cette fonction utilise le coach IA. Ouvre la page depuis claude.ai.'));return}
 [['b','Budget de départ en dollars (ex. 50)'],['s','Ce que tu sais faire'],['v','Ta ville'],['t','Temps par jour (ex. 3 heures)']].forEach(([k,p])=>{const i=E('input');i.type='text';i.placeholder=p;i.value=BF[k];i.maxLength=80;i.setAttribute('aria-label',p);i.oninput=()=>{BF[k]=i.value};v.append(i)});
 const b=E('button','btn',busy?'Essor réfléchit…':'Trouver mes idées');b.disabled=busy;b.onclick=ideas;v.append(b);
 if(B&&!B.length)v.append(E('p','mut','Je n\u2019ai pas pu créer d\u2019idées. Réessaie.'));
 (B||[]).forEach(x=>{const c=E('div','card');c.style.cssText='display:flex;flex-direction:column;gap:8px';
  c.append(E('h2','',String(x.nom||'')),E('p','',String(x.pourquoi||'')),E('p','mut','Capital : '+String(x.capital||'')+' · Gain possible : '+String(x.gain||'')));
  (Array.isArray(x.etapes)?x.etapes:[]).slice(0,3).forEach((e,i)=>c.append(E('p','',(i+1)+'. '+String(e))));
  const u=E('button','opt','En faire mon objectif');u.onclick=()=>{S.goal=String(x.nom||'').slice(0,80);save();tab='plan';newPlan()};c.append(u);v.append(c)});
 v.append(E('p','mut','Ce sont des estimations, pas des garanties de gain. Teste petit avant de dépenser.'))}
